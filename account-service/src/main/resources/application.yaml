server:
  port: 8002


spring:
  application:
    name: account-service
  liquibase:
    change-log: migrations/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/account_service_db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}


token:
  signing:
    key: ${JWT_SECRET}
  access:
    ttl: 15m
  refresh:
    ttl: 30d

catalog:
  items:
    skins:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json
    stickers:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/stickers.json
    containers:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/crates.json