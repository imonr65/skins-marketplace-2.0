spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_service_db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: migrations/db.changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094,localhost:9096}
    admin:
      auto-create: false

app:
  kafka:
    topics:
      items:
        name: items
        partitions: 2
        min-in-sync-replicas: 2
        replicas: 2
    outbox:
      outbox-send-batch-size: 50
      outbox-delete-batch-size: 100
      fixed-delay-for-process-messages: 60_000
      fixed-delay-for-delete-messages: 300_000

  items:
    skins:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json
    stickers:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/stickers.json
    crates:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/crates.json
    collections:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/collections.json
    agents:
      url: https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/agents.json